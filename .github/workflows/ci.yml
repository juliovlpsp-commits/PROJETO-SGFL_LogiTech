name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # O runner do GitHub já tem Docker, necessário para o FlywayMigrationTest (Testcontainers).
      - name: Validar backend e empacotar (testes H2 + Testcontainers/PostgreSQL e Redis)
        run: mvn -B verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: target/surefire-reports/

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sgfl-frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sgfl-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes do frontend
        run: npm test

      - name: Build de produção
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sgfl-frontend
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sgfl-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium e dependências
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta no navegador
        run: npm run test:e2e

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: sgfl-frontend/test-results/
          if-no-files-found: ignore
