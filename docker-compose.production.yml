# Use com infraestrutura PostgreSQL e Redis gerenciada. O TLS deve terminar
# no proxy/ingress da plataforma antes de encaminhar para a porta HTTP publicada.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Configure DB_URL com o JDBC URL do PostgreSQL gerenciado}
      DB_USERNAME: ${DB_USERNAME:?Configure DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no cofre de segredos da plataforma}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no cofre de segredos da plataforma}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_COOKIE_SECURE: "true"
      FORWARD_HEADERS_STRATEGY: native
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Configure a origem HTTPS do frontend}
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:?Configure REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD no cofre de segredos da plataforma}
      SPRING_DATA_REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORAGE: redis
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-15}
      RATE_LIMIT_AUTH_TOKENS: ${RATE_LIMIT_AUTH_TOKENS:-15}
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-120}
      RATE_LIMIT_API_TOKENS: ${RATE_LIMIT_API_TOKENS:-120}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
    networks:
      - sgfl-production

  frontend:
    build:
      context: ./sgfl-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SGFL_HTTP_PORT:-8080}:80"
    networks:
      - sgfl-production

networks:
  sgfl-production:
    driver: bridge
