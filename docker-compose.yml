name: projetosgfl_logitech

services:

  postgres:
    image: postgres:15-alpine
    container_name: sgfl-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgfl_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sgfl_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - sgfl-network

  redis:
    image: redis:7-alpine
    container_name: sgfl-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --save \"\" --appendonly no --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --save \"\" --appendonly no; fi"]
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sgfl-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sgfl-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sgfl_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_PROFILES_ACTIVE: prod

      FLYWAY_ENABLED: "true"
      DDL_AUTO: validate

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_STORAGE: redis
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-15}
      RATE_LIMIT_AUTH_TOKENS: ${RATE_LIMIT_AUTH_TOKENS:-15}
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-120}
      RATE_LIMIT_API_TOKENS: ${RATE_LIMIT_API_TOKENS:-120}

      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SGFL_UPLOAD_DIR: /app/uploads/comprovantes

      # Avisos de status por e-mail (desligados por padrão)
      SGFL_MAIL_ENABLED: ${SGFL_MAIL_ENABLED:-false}
      SGFL_MAIL_HOST: ${SGFL_MAIL_HOST:-}
      SGFL_MAIL_PORT: ${SGFL_MAIL_PORT:-587}
      SGFL_MAIL_USERNAME: ${SGFL_MAIL_USERNAME:-}
      SGFL_MAIL_PASSWORD: ${SGFL_MAIL_PASSWORD:-}
      SGFL_MAIL_FROM: ${SGFL_MAIL_FROM:-noreply@sgfl.local}
      SGFL_MAIL_TO: ${SGFL_MAIL_TO:-}
      SGFL_MAIL_STARTTLS: ${SGFL_MAIL_STARTTLS:-true}
      SGFL_PUBLIC_URL: ${SGFL_PUBLIC_URL:-http://localhost:5173}

      # Modo de baixa de estoque dos pedidos: IMEDIATA (padrão) ou RESERVA
      SGFL_STOCK_MODE: ${SGFL_STOCK_MODE:-IMEDIATA}

    volumes:
      - sgfl_uploads:/app/uploads

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10

    networks:
      - sgfl-network


  frontend:
    build:
      context: ./sgfl-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: /api

    container_name: sgfl-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"
      - "80:80"

    networks:
      - sgfl-network

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: sgfl-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/sgfl-alerts.yml:/etc/prometheus/sgfl-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sgfl-network


volumes:
  sgfl_uploads:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local


networks:
  sgfl-network:
    driver: bridge
