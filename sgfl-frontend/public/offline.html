<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#A54552" />
  <title>SGFL - Sem conexão</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #100C0B;
      color: #FBEFF2;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px 28px;
      border: 1px solid #3A2226;
      border-radius: 16px;
      background: #17100F;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #2A1418;
      color: #E7A0AC;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { font-size: 24px; margin: 18px 0 8px; }
    p { color: #C9B7BA; line-height: 1.6; margin: 0 0 22px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      background: #A54552;
      color: #FFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #B84D5E; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <span class="badge">Offline</span>
    <h1>Você está sem conexão</h1>
    <p>
      A página solicitada não está salva no dispositivo e a rede está indisponível.
      Assim que a conexão voltar, esta tela se recarrega sozinha.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</main>
<script>
  window.addEventListener('online', function () {
    location.reload();
  });
</script>
</body>
</html>
