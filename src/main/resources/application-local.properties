# Perfil de desenvolvimento portatil. Usa um banco H2 no proprio computador,
# sem exigir um servidor PostgreSQL ou Docker.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sgfl;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# O Hibernate cria e atualiza o esquema local. As migracoes existentes sao
# especificas do PostgreSQL e continuam ativas no perfil de producao/Docker.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# A interface embutida e a API ficam acessiveis apenas no computador local.
server.address=127.0.0.1

# Valores locais para a primeira inicializacao. O script de execucao cria um
# segredo aleatorio e pede as credenciais iniciais do administrador.
jwt.secret=${JWT_SECRET:sgfl-local-only-secret-change-before-network-use-2026}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cookie.secure=false
