spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgfl_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Evita LazyInitializationException fora de transacao
spring.jpa.open-in-view=false

# JWT
# O segredo deve obrigatoriamente vir do ambiente.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate Limiting
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:15}
ratelimit.auth.tokens-per-minute=${RATE_LIMIT_AUTH_TOKENS:15}
ratelimit.api.capacity=${RATE_LIMIT_API_CAPACITY:120}
ratelimit.api.tokens-per-minute=${RATE_LIMIT_API_TOKENS:120}

# Bootstrap do administrador inicial
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# CORS: origens do front-end autorizadas (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cookie.secure=${APP_COOKIE_SECURE:false}

# Atras de proxy (nginx/Docker): o Tomcat so confia em X-Forwarded-For vindo de proxies
# internos (faixas privadas) e entrega o IP real do cliente em request.getRemoteAddr().
# Usado pelo rate limit e pelos logs. Use NONE se a aplicacao ficar exposta sem proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
