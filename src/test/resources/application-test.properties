# Configuracao usada SOMENTE durante a execucao dos testes automatizados.
# Banco em memoria (H2): os testes nao dependem do Postgres local nem alteram dados reais.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway desativado nos testes gerais para permitir create-drop isolado do H2
spring.flyway.enabled=false

jwt.secret=chave-de-teste-usada-apenas-em-ambiente-automatizado-1234567890
jwt.expiration-ms=3600000

# Rate limiting desativado por padrão nos testes de integração existentes
ratelimit.enabled=false
ratelimit.storage=memory
management.server.port=0
