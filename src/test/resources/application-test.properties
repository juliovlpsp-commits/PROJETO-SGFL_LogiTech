# Configuracao usada SOMENTE durante a execucao dos testes automatizados.
# Banco em memoria (H2): os testes nao dependem do Postgres local nem alteram dados reais.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=chave-de-teste-usada-apenas-em-ambiente-automatizado-1234567890
jwt.expiration-ms=3600000
