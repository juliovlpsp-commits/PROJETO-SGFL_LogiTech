spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgfl_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4040}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexoes (HikariCP) - valores de partida sensatos para producao
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Hibernate / JPA
# Com Flyway gerenciando as migrações, ddl-auto deve ser validate em produção/desenvolvimento
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Evita LazyInitializationException silenciosa fora de transacao
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:SgflLogiTechChaveSecretaMuitoSeguraParaAssinaturaDoTokenJWT123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate Limiting (Bucket4j)
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:15}
ratelimit.auth.tokens-per-minute=${RATE_LIMIT_AUTH_TOKENS:15}
ratelimit.api.capacity=${RATE_LIMIT_API_CAPACITY:120}
ratelimit.api.tokens-per-minute=${RATE_LIMIT_API_TOKENS:120}

